<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Internship radar{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f4bd8'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <script>
    // Apply theme before paint: saved choice, else system preference.
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: { sans: ["Familjen Grotesk", "system-ui", "sans-serif"] },
          fontSize: { xs: ["13px", "1.45"], base: ["16px", "1.5"], lg: ["20px", "1.35"], xl: ["26px", "1.2"], "2xl": ["36px", "1.1"] },
          colors: {
            paper: "var(--paper)", surface: "var(--surface)", ink: "var(--ink)", ink2: "var(--ink-2)",
            line: "var(--line)", accent: "var(--accent)", "on-accent": "var(--on-accent)", "accent-soft": "var(--accent-soft)",
            pin: "var(--pin)", ok: "var(--ok)", bad: "var(--bad)", "bad-soft": "var(--bad-soft)"
          }
        }
      }
    };
  </script>
  <style>
    /* quiet-product tokens */
    :root {
      --paper: #e4e9e6; --surface: #f7f9f7; --ink: #17262b; --ink-2: #4d5e62; --line: #c9d3cf;
      --accent: #2f4bd8; --on-accent: #ffffff; --accent-soft: #e3e8fb; --pin: #f2c230; --ok: #1f7a5c; --bad: #b3261e; --bad-soft: #f8e3e1;
    }
    html.dark {
      --paper: #121a1c; --surface: #1a2427; --ink: #e3ebe8; --ink-2: #9aaaa9; --line: #2c3a3d;
      --accent: #8a9cff; --on-accent: #0f1530; --accent-soft: #232c52; --pin: #f2c230; --ok: #5cc49c; --bad: #ff8a80; --bad-soft: #3a2021;
    }
    body { background: var(--paper); color: var(--ink); }
    h1, h2, h3 { letter-spacing: -0.01em; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    select, input, textarea { background: var(--surface); color: var(--ink); }
  </style>
</head>
<body class="font-sans antialiased min-h-screen">
  {% block body %}{% endblock %}
  <script src="/static/app.js"></script>
</body>
</html>
